---
# Phase 0: headless, reproducible Mac mini. Phase 1: Wyze bridge + Mosquitto.
#   make provision   -> apply
#   make check       -> drift (--check --diff)
#   make verify      -> post-reboot assertions (strict_quiet=true)
- name: Provision ranch-ai
  hosts: ranch
  gather_facts: true
  roles:
    - base
    - access
    - quiet
    - packages
    - tailscale
    - mosquitto
    - wyze_bridge
    - services
