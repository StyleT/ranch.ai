---
ranch_user: ranch
ranch_uid: 501
ranch_hostname: ranch-ai
timezone: America/New_York

# Design decision (PLAN.md 4.2): no GUI session. Tailscale runs as a system daemon,
# so nothing needs auto-login. Set true only if a future surface needs a logged-in user.
autologin: false

# make verify sets this true after a reboot: the quiet role then fails if any
# disabled agent is still running.
strict_quiet: false

laptop_pubkey: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"

pmset_settings:
  sleep: "0"
  displaysleep: "0"
  disksleep: "0"
  autorestart: "1"
  womp: "1"

softwareupdate_settings:
  # AutomaticCheckEnabled is left alone: softwareupdated rewrites it at every boot (default on)
  AutomaticDownload: true
  CriticalUpdateInstall: true
  ConfigDataInstall: true
  AutomaticallyInstallMacOSUpdates: false   # the box never reboots on Apple's schedule

# Per-user launch agents that burned CPU/RAM on a fresh headless install (13 Oct 2026 diagnosis).
# Each is `launchctl disable gui/<uid>/<label>`; takes effect at next login/reboot.
disabled_agents:
  - com.apple.mediaanalysisd
  - com.apple.visualintelligenced
  - com.apple.photoanalysisd
  - com.apple.photolibraryd
  - com.apple.imagent
  - com.apple.imdpersistence.IMDPersistenceAgent
  - com.apple.cloudd
  - com.apple.itunescloudd
  - com.apple.spotlightknowledged
  - com.apple.spotlightknowledged.updater
  - com.apple.spotlightknowledged.importer
  - com.apple.corespotlightd
  - com.apple.knowledgeconstructiond
  - com.apple.intelligenceflowd
  - com.apple.intelligencecontextd
  - com.apple.intelligencetasksd
  - com.apple.siriactionsd
  - com.apple.sirittsd
  - com.apple.siriknowledged
  - com.apple.siriinferenced
  - com.apple.suggestd

# System-domain daemons to disable on a headless box (`launchctl disable system/<label>`, effective at
# next boot). com.apple.audiomxd: on macOS 27.0.1 with no console user it spins at ~75% CPU together
# with configd (Bluetooth audio-routing loop asking for a user session that never comes). Audio is
# useless headless. Reversible with `launchctl enable system/<label>`.
disabled_system_daemons:
  - com.apple.audiomxd   # launchd ignores this (SIP); kept as documentation. Real fix: quiet-audiomxd daemon.

# System processes that must be absent OR paused (SIGSTOP, state T) when nobody is logged in.
quiet_system_process_names:
  - audiomxd

# Process names to assert absent (pgrep -x -u ranch) once the disables are live.
quiet_process_names:
  - mediaanalysisd
  - visualintelligenced
  - photoanalysisd
  - photolibraryd
  - imagent
  - IMDPersistenceAgent
  - cloudd
  - itunescloudd
  - spotlightknowledged
  - corespotlightd
  - knowledgeconstructiond
  - intelligenceflowd
  - intelligencecontextd
  - intelligencetasksd
  - siriactionsd
  - sirittsd
  - siriknowledged
  - siriinferenced
  - suggestd

brew_prefix: /opt/homebrew
tailscale_state_dir: /var/db/ranch-tailscale
ranch_bin_dir: /usr/local/ranch/bin
node_major: "24"

# ---- Phase 1: camera ingest -------------------------------------------------
ranch_src_dir: /usr/local/ranch/src       # source checkouts, owned by ranch
ranch_var_dir: /usr/local/ranch/var       # daemon state (bridge state file, mosquitto persistence)
ranch_media_dir: /usr/local/ranch/media   # snapshots and recordings (same disk; 200 GB free on 14 Oct)
ranch_etc_dir: /usr/local/ranch/etc       # config files we template (go2rtc.yaml)
go2rtc_api_port: 1984
go2rtc_api_log: trace     # 23 Oct: go2rtc logs "[api] METHOD URL remote" only at trace; one day of it derives api.allow_paths (docs/CAMERA-ARCHITECTURE.md); then warn
# go2rtc holds these cameras' sessions itself (preload), so a recorder restart is not a camera redial. 23 Oct: trial on
# one camera for 24 h (compare producer starts/hour and availability with the others), then the fleet or not.
go2rtc_preload_cameras:
  - donkey_cam

# Wyze bridge: IDisposable's Go rewrite on top of go2rtc (docs/CAMERAS.md). Pure Go, no cgo, built on
# the mini with Homebrew go. Pinned to a release tag; bump deliberately and re-measure.
wyze_bridge_repo: https://github.com/IDisposable/docker-wyze-bridge.git
# "4" follows the newest stable v4.x.y tag, like the Docker image tag `4` (betas and edge builds excluded);
# a full tag such as v4.5.0 pins. The resolved tag goes into the build stamp and the binary's version string.
wyze_bridge_version: "4"
# go2rtc is the bridge's managed sidecar. The fork's Dockerfile pins this version; the macOS arm64
# build is a zip on the GitHub release. Checksum of the zip, computed 14 Oct 2026.
go2rtc_version: 1.9.14
go2rtc_url: "https://github.com/AlexxIT/go2rtc/releases/download/v{{ go2rtc_version }}/go2rtc_mac_arm64.zip"
go2rtc_sha256: 919b78adc759d6b3883d1e1b2ac915ac0985bb903ff1897b4d228527bd64690c

# Mosquitto: loopback only for now. The bridge, the sampler and the brain all run on this box.
mosquitto_listen: 127.0.0.1
mosquitto_port: 1883

# Every streamed camera (all except living_room_cam). The recorder owns one stream per camera; the sampler reads
# the recorder's disk buffer for exactly these names (RANCH_CAMERAS), never the bridge. See docs/CAMERA-ARCHITECTURE.md.
ranch_cameras:
  - back_yard_cam
  - wash_stall
  - donkey_cam
  - mops_cam
  - front_porch_cam
  - tractor_cam
  - back_pasture_cam
# Recorder (com.ranch.recorder, 22 Oct): the single owner of each camera's live stream. One keyframe-only ffmpeg
# per camera pulls go2rtc's LOCAL RTSP (~1 frame / 2 s, ~3 % CPU/camera) into a rolling JPEG buffer at
# <media>/buffer/<cam>/, kept recorder_buffer_min minutes (~0.2 GB total). Replaces the old seed-recorder and the
# sampler's per-frame go2rtc grabs, which churned camera TUTK handshakes and overloaded the cameras.
recorder_jpeg_q: 4
recorder_buffer_min: 5
recorder_min_free_gb: 20
# HLS live view (23 Oct, docs/WEB-DASHBOARD.md). The same ffmpeg also writes <media>/live/<cam>/ (fMP4, 1 s segments,
# AAC audio) but ONLY while a camera is being watched: re-encoding all seven cameras at once saturated the M2's single
# video-encode engine and the picture fell minutes behind. On-demand, normally 0-1 encoders run and keep real-time at
# ~2-3 s latency. The encode is software-decoded (robust to the lossy TUTK H.264) and hardware-encoded at 720p.
recorder_hls_seg_s: 1
recorder_hls_list: 8
recorder_audio: true
recorder_hls_bitrate: 2000k
recorder_live_height: 720      # encode the live view at this height (cameras are 1440p)
recorder_demand_ttl: 20        # a camera is "watched" if the daemon touched <live>/<cam>/.demand within this many seconds

# ---- Phase 1: apps --------------------------------------------------------------
ranch_app_dir: /usr/local/ranch/app         # rsync of the working tree (roles/app)
ranch_models_dir: /usr/local/ranch/models   # CoreML packages, not in git
# Ports accepted ONLY from Tailscale clients (pf anchor com.ranch): refused on the ranch LAN and every other interface,
# open on loopback. 23 Oct, Vlad: the dashboard is for the phone/laptop over the tailnet, never for the shared Wi-Fi.
# 22 (ssh) stays open everywhere.
tailscale_only_ports:
  - 5090                                     # web dashboard (http://ranch-ai.tail6d04cd.ts.net:5090)
# Ports refused on every interface except lo0 (pf anchor com.ranch), 23 Oct: anything that can attach a go2rtc consumer
# makes go2rtc dial a camera, and the bridge UI on 5080 opens one WebSocket player + one snapshot per camera on load
# (eight consumers per visit, including living_room_cam which nobody else holds). Only processes on the mini may reach
# these; from the laptop use `make tunnel` (ssh -L). docs/CAMERA-ARCHITECTURE.md.
loopback_only_ports:
  - 5080                                     # Wyze bridge UI + API (its metrics are on the dashboard's /system page)
  - 1984                                     # go2rtc API (also bound to 127.0.0.1 in go2rtc.yaml)
  - 8554                                     # go2rtc RTSP (also bound to 127.0.0.1)
  - 8889                                     # go2rtc WebRTC TCP (consumer entry; the source-side fallback is outbound)
ranch_daemons_retired:                       # unloaded and deleted by roles/services
  - com.ranch.logrotate                      # 16 Oct: custom rotation replaced by the unified log
  - com.ranch.seed-recorder                  # 22 Oct: superseded by the always-on recorder (disk buffer)
ranch_scripts_retired:
  - logrotate.sh
  - seed-recorder.sh
ranch_app_daemons:                           # restarted by roles/app when the tree changes
  - com.ranch.ingest
  - com.ranch.detector
  - com.ranch.netprobe
  - com.ranch.camsup
  - com.ranch.status
  - com.ranch.web
# Camera supervisor (com.ranch.camsup, apps/camsup, docs/CAMERA-ARCHITECTURE.md): the remediation ladder. Starts in
# dry-run (decisions recorded, nothing acted on) for a day of evidence; then camsup_dry_run: false arms rungs 2-3.
camsup_dry_run: true
camsup_reboot_after_s: 600                   # rung 2: camera down this long while answering ping -> reboot via the Wyze cloud
camsup_reboot_cooldown_s: 1800               # per camera
camsup_fleet_reboots_per_h: 2
camsup_go2rtc_restart_after_s: 900           # rung 3: this many cameras down this long after a reboot each -> go2rtc restart
camsup_go2rtc_min_cameras: 3

# Tier-1 detector (com.ranch.detector). Model file lives in ranch_models_dir (synced from apps/detector/export).
# yolo26s since 22 Oct (evals/LEADERBOARD.md): horse recall 0.60, FPPF(all) 0.14 under the taxonomy, 22.6 ms p50 on the ANE.
detector_model: yolo26s.mlpackage
detector_compute: ane            # all | ane | gpu | cpu
# The runner's floor; what is kept, under which label and at which threshold is packages/taxonomy (docs/TAXONOMY.md).
detector_threshold: "0.05"
detector_family: coco            # key into MODEL_MAPPINGS; a fine-tuned model gets its own

# Status page (com.ranch.status, apps/status, docs/STATUS-DASHBOARD.md). No auth; LAN + tailnet only.
status_port: 5091       # the status daemon's JSON/SSE API, loopback only since 22 Oct (the web app on 5090 is the page)
status_host: 127.0.0.1
# Next.js dashboard (com.ranch.web, apps/web, docs/WEB-DASHBOARD.md): the page on 5090, tailnet-only via tailscale_only_ports.
web_port: 5090
web_host: 0.0.0.0
web_heap_mb: 256
# Taxonomy editor (docs/TAXONOMY-UI.md): reference datasets the "Score draft" button uses; write token is generated on the mini.
status_reference_frames: evals/baseline/2026-10-20
status_reference_labels: labels-ranch-claude-revised-vlad-v1
