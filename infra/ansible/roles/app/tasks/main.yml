---
# Deploys the TypeScript apps and the Swift detector runner to the mini.
#   - working tree → {{ ranch_app_dir }} (rsync, so the laptop's checkout is what runs; git is the record)
#   - npm ci when the lockfile changed; Node 24 from fnm, symlinked to {{ ranch_bin_dir }}/node for launchd
#   - swiftc build of apps/detector/swift/main.swift → {{ ranch_bin_dir }}/detector when the source changed
#   - CoreML models (not in git; produced by apps/detector/export on the laptop) → {{ ranch_models_dir }}
# Daemons that run these are registered in roles/services like everything else.
- name: App, models and DB dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ranch_user }}"
    group: staff
    mode: "0755"
  become: true
  loop:
    - "{{ ranch_app_dir }}"
    - "{{ ranch_models_dir }}"
    - "{{ ranch_var_dir }}"
    - "{{ ranch_var_dir }}/build"

- name: Node 24 binary path (fnm)
  ansible.builtin.command: "{{ brew_prefix }}/bin/fnm exec --using={{ node_major }} -- node -e 'console.log(process.execPath)'"
  register: node_path
  changed_when: false
  check_mode: false
  environment: { HOME: "/Users/{{ ranch_user }}" }

- name: node symlink for launchd
  ansible.builtin.file:
    src: "{{ node_path.stdout | trim }}"
    dest: "{{ ranch_bin_dir }}/node"
    state: link
  become: true

# --checksum: two checkouts of the same commit differ only in mtimes, so content decides what changed (otherwise
# provisioning from another checkout restarts every daemon). Lines starting with "." are attribute-only (mtime) and
# never count as a change. --prune-empty-dirs: git does not track empty dirs, so leftovers in one checkout don't sync.
# .claude: session tooling, and the main checkout contains whole nested worktrees under .claude/worktrees.
- name: Sync working tree to the mini
  ansible.builtin.command: >-
    rsync -ai --delete --checksum --prune-empty-dirs {{ '--dry-run' if ansible_check_mode else '' }}
    --exclude .git --exclude .claude --exclude node_modules --exclude .scratch --exclude .venv --exclude infra/snapshots
    --exclude '*.mlpackage' --exclude '*.mlmodelc' --exclude '*.pt' --exclude .DS_Store --exclude 'evals/baseline/*/frames' --exclude 'apps/web/.next' --exclude 'apps/web/test-results' --exclude 'apps/web/playwright-report' --exclude 'apps/web/e2e/ai/runs' --exclude 'apps/web/coverage' --exclude 'apps/web/tsconfig.tsbuildinfo'
    -e "ssh -o BatchMode=yes" {{ playbook_dir }}/../../ {{ ansible_user }}@{{ ansible_host }}:{{ ranch_app_dir }}/
  delegate_to: localhost
  register: app_sync
  changed_when: app_sync.stdout_lines | select('match', '^[<>ch*]') | list | length > 0
  check_mode: false

# Models are git-ignored and exist only in the checkout that exported them (the main checkout); a fresh worktree has
# none, and syncing its empty export dir with --delete would remove every model package from the mini. Skip instead.
- name: Exported models in this checkout
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../../apps/detector/export"
    patterns: "*.mlpackage"
    file_type: directory
  delegate_to: localhost
  register: models_src

- name: Sync CoreML models
  ansible.builtin.command: >-
    rsync -ai --delete {{ '--dry-run' if ansible_check_mode else '' }}
    --include '*.mlpackage' --include '*.mlpackage/**' --include '*.labels.json' --exclude '*'
    -e "ssh -o BatchMode=yes" {{ playbook_dir }}/../../apps/detector/export/ {{ ansible_user }}@{{ ansible_host }}:{{ ranch_models_dir }}/
  delegate_to: localhost
  register: models_sync
  changed_when: models_sync.stdout_lines | select('match', '^[<>ch*]') | list | length > 0
  check_mode: false
  when: models_src.matched > 0

- name: Models left as they are on the mini (this checkout has no exported models)
  ansible.builtin.debug:
    msg: "skipped the model sync: apps/detector/export has no *.mlpackage here (fresh worktree?); provision from the checkout that exported them to update models"
  when: models_src.matched == 0

- name: node_modules present?
  ansible.builtin.stat:
    path: "{{ ranch_app_dir }}/node_modules/.package-lock.json"
  register: nm

- name: npm ci (lockfile changed or first deploy)
  ansible.builtin.command:
    cmd: "{{ ranch_bin_dir }}/node {{ node_path.stdout | trim | dirname }}/npm ci --no-audit --no-fund"
    chdir: "{{ ranch_app_dir }}"
  environment: { HOME: "/Users/{{ ranch_user }}", PATH: "{{ node_path.stdout | trim | dirname }}:/usr/bin:/bin" }
  when: not nm.stat.exists or (app_sync.stdout is search('package-lock\.json'))
  notify: restart app daemons

- name: Detector binary present?
  ansible.builtin.stat:
    path: "{{ ranch_bin_dir }}/detector"
  register: det_bin

- name: Build detector (swiftc, ~35 s)
  ansible.builtin.command:
    cmd: "/usr/bin/swiftc -O -o {{ ranch_var_dir }}/build/detector {{ ranch_app_dir }}/apps/detector/swift/main.swift"
  environment: { HOME: "/Users/{{ ranch_user }}" }
  when: not det_bin.stat.exists or (app_sync.stdout is search('apps/detector/swift/main\.swift'))
  register: det_build

- name: Install detector
  ansible.builtin.copy:
    src: "{{ ranch_var_dir }}/build/detector"
    dest: "{{ ranch_bin_dir }}/detector"
    remote_src: true
    owner: root
    group: wheel
    mode: "0755"
  become: true
  when: det_build is changed
  notify: restart app daemons

# Only code the daemons load triggers a restart; docs, infra and eval data do not.
# Next.js build on the mini (docs/WEB-DASHBOARD.md §5): only when apps/web (minus tests), packages/ or the lockfile
# changed since the last build, judged by a content hash kept in the build dir. ~1-2 min, ~1.5 GB peak: a provision
# with a web change needs that much free memory.
- name: Web app built
  ansible.builtin.shell: |
    set -e; cd {{ ranch_app_dir }}
    want=$( { find apps/web packages -type f \
        -not -path '*/.next/*' -not -path '*/node_modules/*' -not -path 'apps/web/test/*' -not -path 'apps/web/e2e/*' \
        -not -path 'apps/web/test-results/*' -not -path 'apps/web/playwright-report/*' -not -path 'apps/web/coverage/*' -not -name 'next-env.d.ts' -not -name 'tsconfig.tsbuildinfo' -not -name '.DS_Store' \
        -print0 | sort -z | xargs -0 shasum -a 256; shasum -a 256 package-lock.json; } | shasum -a 256 | cut -c1-64 )
    have=$(cat {{ ranch_var_dir }}/build/web.sha256 2>/dev/null || true)
    server=apps/web/.next/standalone/apps/web/server.js
    if [ "$want" = "$have" ] && [ -f "$server" ]; then echo UNCHANGED; exit 0; fi
    {% if ansible_check_mode %}echo "WOULD BUILD"; exit 0{% endif %}
    mkdir -p {{ ranch_var_dir }}/build
    export NODE_OPTIONS=--max-old-space-size=2048 NEXT_TELEMETRY_DISABLED=1 CI=1 RANCH_BUILD_COMMIT='{{ lookup('pipe', 'git -C ' ~ playbook_dir ~ ' rev-parse --short HEAD') }}'
    {{ ranch_bin_dir }}/node {{ node_path.stdout | trim | dirname }}/npm run build -w apps/web > {{ ranch_var_dir }}/build/web-build.log 2>&1
    echo "$want" > {{ ranch_var_dir }}/build/web.sha256
    echo BUILT
  environment: { HOME: "/Users/{{ ranch_user }}", PATH: "{{ node_path.stdout | trim | dirname }}:/usr/bin:/bin" }
  become: true
  become_user: "{{ ranch_user }}"
  register: web_build
  changed_when: "'BUILT' in web_build.stdout or 'WOULD BUILD' in web_build.stdout"
  check_mode: false
  notify: restart app daemons

- name: App daemons restart when their code changed
  ansible.builtin.debug:
    msg: "app code changed; app daemons will restart"
  when: app_sync.stdout is search('(^|\s)[<>ch*][^\s]*\s+(apps/(?!web/(test|e2e)/)|packages/|package(-lock)?\.json)')
  changed_when: true
  notify: restart app daemons

# The repo's taxonomy.json becomes the active version when it differs from the one on the mini (docs/TAXONOMY-UI.md §2).
# In check mode it only reports (drift). Runs after the restart handler so the daemons see the same schema.
- name: Flush handlers before the taxonomy sync
  ansible.builtin.meta: flush_handlers

- name: Taxonomy from the repo file is the active version
  ansible.builtin.command:
    cmd: "{{ ranch_bin_dir }}/node --no-warnings=ExperimentalWarning packages/taxonomy/src/cli.ts sync{{ ' --check' if ansible_check_mode else '' }}"
    chdir: "{{ ranch_app_dir }}"
  register: tax_sync
  changed_when: "'inserted' in tax_sync.stdout or 'would insert' in tax_sync.stdout"
  check_mode: false
  become: true
  become_user: "{{ ranch_user }}"
