---
# Each name here is a template infra/launchd/<name>.plist.j2 -> /Library/LaunchDaemons/<name>.plist
- name: Daemon list
  ansible.builtin.set_fact:
    ranch_daemons:
      - com.ranch.pf
      - com.ranch.caffeinate
      - com.ranch.quiet-audiomxd
      - com.ranch.mosquitto
      - com.ranch.go2rtc
      - com.ranch.wyze-bridge
      - com.ranch.recorder
      - com.ranch.ingest
      - com.ranch.detector
      - com.ranch.netprobe
      - com.ranch.status
      - com.ranch.web

- name: Ranch bin dir
  ansible.builtin.file:
    path: "{{ ranch_bin_dir }}"
    state: directory
    owner: root
    group: wheel
    mode: "0755"
  become: true

# script -> daemon that runs it (empty = no daemon, e.g. the CLI wrapper)
- name: Ranch scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../bin/{{ item.name }}"
    dest: "{{ ranch_bin_dir }}/{{ item.name }}"
    owner: root
    group: wheel
    mode: "0755"
  become: true
  loop:
    - { name: quiet-audiomxd.sh, daemon: com.ranch.quiet-audiomxd }
    - { name: wyze-bridge.sh, daemon: com.ranch.wyze-bridge }
    - { name: recorder.sh, daemon: com.ranch.recorder }
    - { name: camera-owners.sh, daemon: "" }
    - { name: ranch, daemon: "" }
  loop_control: { label: "{{ item.name }}" }
  register: scripts

# Daemon output goes through logger(1) into the unified log (see CLAUDE.md); the old per-daemon files are gone.
- name: Old /var/log/ranch-*.log files removed
  ansible.builtin.shell: |
    set -e; removed=0
    for f in /var/log/ranch-*.log /var/log/ranch-*.log.*.gz; do [ -e "$f" ] && rm -f "$f" && removed=$((removed+1)); done
    echo "removed=$removed"
  register: oldlogs
  changed_when: "'removed=0' not in oldlogs.stdout"
  become: true

# Daemons that existed once and must not come back (plist and script removed, job unloaded).
- name: Retired daemons unloaded
  ansible.builtin.shell: |
    if launchctl print system/{{ item }} >/dev/null 2>&1; then launchctl bootout system/{{ item }}; echo UNLOADED; fi
  register: retired
  changed_when: "'UNLOADED' in retired.stdout"
  become: true
  loop: "{{ ranch_daemons_retired }}"

- name: Retired daemon plists and scripts absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop: "{{ ranch_daemons_retired | map('regex_replace', '^(.*)$', '/Library/LaunchDaemons/\\1.plist') | list + ranch_scripts_retired | map('regex_replace', '^(.*)$', ranch_bin_dir ~ '/\\1') | list }}"

# Packet filter: close tailscale_blocked_ports on the node's Tailscale addresses and loopback_only_ports on every
# interface but lo0 (docs/CAMERA-ARCHITECTURE.md, docs/WEB-DASHBOARD.md).
- name: Tailscale addresses of this node
  ansible.builtin.command: /opt/homebrew/bin/tailscale ip
  register: ts_ip
  changed_when: false
  check_mode: false

- name: pf anchor com.ranch
  ansible.builtin.template:
    src: pf.anchors.com.ranch.j2
    dest: /etc/pf.anchors/com.ranch
    owner: root
    group: wheel
    mode: "0644"
  vars:
    tailscale_addrs: "{{ ts_ip.stdout_lines }}"
  become: true
  register: pf_anchor

- name: pf.conf loads the com.ranch anchor
  ansible.builtin.blockinfile:
    path: /etc/pf.conf
    marker: "# {mark} ANSIBLE MANAGED: com.ranch anchor"
    block: |
      anchor "com.ranch"
      load anchor "com.ranch" from "/etc/pf.anchors/com.ranch"
  become: true
  register: pf_conf

- name: pf enabled with the current ruleset
  ansible.builtin.shell: /sbin/pfctl -E -f /etc/pf.conf 2>&1; /sbin/pfctl -s info 2>/dev/null | head -1
  register: pf_apply
  changed_when: pf_anchor.changed or pf_conf.changed
  failed_when: "'Status: Enabled' not in pf_apply.stdout"
  become: true
  when: not ansible_check_mode

# The single-consumer rule, measured (docs/CAMERA-ARCHITECTURE.md): go2rtc on loopback only, every RTSP client an
# ffmpeg of com.ranch.recorder, ≤ 1 consumer per stream, only the recorder writing the buffer. Reported on every run,
# fatal in verify mode (-e strict_quiet=true) so a regression fails `make verify` instead of killing a camera.
- name: Camera owners (single-consumer rule)
  ansible.builtin.command: "{{ ranch_bin_dir }}/camera-owners.sh"
  register: owners
  changed_when: false
  check_mode: false
  failed_when: owners.rc != 0 and (strict_quiet | default(false) | bool)
  become: true
- name: Camera owners report
  ansible.builtin.debug:
    msg: "{{ owners.stdout_lines }}"

# Loopback-only ports must be refused from outside the mini. Checked from the laptop over the tailnet address (the
# LAN path is the same pf rule on another interface; curl exit 7 = connection refused is the pass condition).
- name: Loopback-only ports refused from the laptop
  ansible.builtin.command: "curl -s -m 3 -o /dev/null http://{{ ansible_host | default(inventory_hostname) }}:{{ item }}/"
  register: closed
  delegate_to: localhost
  changed_when: false
  check_mode: false
  failed_when: closed.rc == 0
  loop: "{{ loopback_only_ports }}"
  when: not ansible_check_mode

# Write token for the status page's editors (docs/TAXONOMY-UI.md §6): generated once on the mini, never in the repo.
- name: Status write token exists
  ansible.builtin.shell: |
    f=/Users/{{ ranch_user }}/.config/ranch/status.env
    if [ ! -f "$f" ]; then (umask 077; printf 'RANCH_STATUS_WRITE_TOKEN=%s\n' "$(/usr/bin/openssl rand -hex 16)" > "$f"); echo CREATED; fi
  register: status_env
  changed_when: "'CREATED' in status_env.stdout"
  become: true
  become_user: "{{ ranch_user }}"

- name: Install daemon plists
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../launchd/{{ item }}.plist.j2"
    dest: /Library/LaunchDaemons/{{ item }}.plist
    owner: root
    group: wheel
    mode: "0644"
  become: true
  loop: "{{ ranch_daemons }}"
  register: plists

# Only daemons whose plist or script changed get restarted (a kickstart of the bridge drops every stream).
# A changed plist needs bootout + bootstrap: `kickstart -k` restarts the job with the definition launchd
# already loaded, so new EnvironmentVariables or ProgramArguments would never take effect (seen 16 Oct).
- name: Daemons to reload
  ansible.builtin.set_fact:
    daemons_to_reload: "{{ scripts.results | selectattr('changed') | map(attribute='item.daemon') | reject('equalto', '') | list | unique }}"
    daemons_to_rebootstrap: "{{ plists.results | selectattr('changed') | map(attribute='item') | list | unique }}"
  changed_when: (daemons_to_reload | length + daemons_to_rebootstrap | length) > 0
  notify:
    - rebootstrap launchd daemons
    - reload launchd daemons

- name: Daemons loaded?
  ansible.builtin.command: launchctl print system/{{ item }}
  become: true
  register: ld
  changed_when: false
  check_mode: false
  failed_when: false
  loop: "{{ ranch_daemons }}"

- name: Bootstrap missing daemons
  ansible.builtin.command: launchctl bootstrap system /Library/LaunchDaemons/{{ item.item }}.plist
  become: true
  loop: "{{ ld.results }}"
  loop_control: { label: "{{ item.item }}" }
  when: item.rc != 0
