---
# Each name here is a template infra/launchd/<name>.plist.j2 -> /Library/LaunchDaemons/<name>.plist
- name: Daemon list
  ansible.builtin.set_fact:
    ranch_daemons:
      - com.ranch.caffeinate
      - com.ranch.quiet-audiomxd
      - com.ranch.mosquitto
      - com.ranch.go2rtc
      - com.ranch.wyze-bridge
      - com.ranch.seed-recorder
      - com.ranch.ingest
      - com.ranch.detector
      - com.ranch.netprobe
      - com.ranch.logrotate
      - com.ranch.status

- name: Ranch bin dir
  ansible.builtin.file:
    path: "{{ ranch_bin_dir }}"
    state: directory
    owner: root
    group: wheel
    mode: "0755"
  become: true

# script -> daemon that runs it (empty = no daemon, e.g. the CLI wrapper)
- name: Ranch scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../bin/{{ item.name }}"
    dest: "{{ ranch_bin_dir }}/{{ item.name }}"
    owner: root
    group: wheel
    mode: "0755"
  become: true
  loop:
    - { name: quiet-audiomxd.sh, daemon: com.ranch.quiet-audiomxd }
    - { name: wyze-bridge.sh, daemon: com.ranch.wyze-bridge }
    - { name: seed-recorder.sh, daemon: com.ranch.seed-recorder }
    - { name: ranch, daemon: "" }
    - { name: logrotate.sh, daemon: com.ranch.logrotate }
  loop_control: { label: "{{ item.name }}" }
  register: scripts

- name: Log files for daemons that run as {{ ranch_user }} (launchd opens StandardOutPath as that user; /var/log is root 755)
  ansible.builtin.file:
    path: /var/log/{{ item }}.log
    state: touch
    owner: "{{ ranch_user }}"
    group: wheel
    mode: "0644"
    access_time: preserve
    modification_time: preserve
  become: true
  loop:
    - ranch-mosquitto
    - ranch-go2rtc
    - ranch-netprobe
    - ranch-wyze-bridge
    - ranch-seed-recorder
    - ranch-ingest
    - ranch-detector
    - ranch-status

- name: Install daemon plists
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../launchd/{{ item }}.plist.j2"
    dest: /Library/LaunchDaemons/{{ item }}.plist
    owner: root
    group: wheel
    mode: "0644"
  become: true
  loop: "{{ ranch_daemons }}"
  register: plists

# Only daemons whose plist or script changed get restarted (a kickstart of the bridge drops every stream).
# A changed plist needs bootout + bootstrap: `kickstart -k` restarts the job with the definition launchd
# already loaded, so new EnvironmentVariables or ProgramArguments would never take effect (seen 16 Oct).
- name: Daemons to reload
  ansible.builtin.set_fact:
    daemons_to_reload: "{{ scripts.results | selectattr('changed') | map(attribute='item.daemon') | reject('equalto', '') | list | unique }}"
    daemons_to_rebootstrap: "{{ plists.results | selectattr('changed') | map(attribute='item') | list | unique }}"
  changed_when: (daemons_to_reload | length + daemons_to_rebootstrap | length) > 0
  notify:
    - rebootstrap launchd daemons
    - reload launchd daemons

- name: Daemons loaded?
  ansible.builtin.command: launchctl print system/{{ item }}
  become: true
  register: ld
  changed_when: false
  check_mode: false
  failed_when: false
  loop: "{{ ranch_daemons }}"

- name: Bootstrap missing daemons
  ansible.builtin.command: launchctl bootstrap system /Library/LaunchDaemons/{{ item.item }}.plist
  become: true
  loop: "{{ ld.results }}"
  loop_control: { label: "{{ item.item }}" }
  when: item.rc != 0
