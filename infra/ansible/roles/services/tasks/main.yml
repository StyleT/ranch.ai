---
# Each name here is a template infra/launchd/<name>.plist.j2 -> /Library/LaunchDaemons/<name>.plist
- name: Daemon list
  ansible.builtin.set_fact:
    ranch_daemons:
      - com.ranch.caffeinate
      - com.ranch.quiet-audiomxd
      - com.ranch.mosquitto
      - com.ranch.wyze-bridge

- name: Ranch bin dir
  ansible.builtin.file:
    path: "{{ ranch_bin_dir }}"
    state: directory
    owner: root
    group: wheel
    mode: "0755"
  become: true

- name: Ranch scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../bin/{{ item }}"
    dest: "{{ ranch_bin_dir }}/{{ item }}"
    owner: root
    group: wheel
    mode: "0755"
  become: true
  loop:
    - quiet-audiomxd.sh
    - wyze-bridge.sh
  notify: reload launchd daemons

- name: Log files for daemons that run as {{ ranch_user }} (launchd opens StandardOutPath as that user; /var/log is root 755)
  ansible.builtin.file:
    path: /var/log/{{ item }}.log
    state: touch
    owner: "{{ ranch_user }}"
    group: wheel
    mode: "0644"
    access_time: preserve
    modification_time: preserve
  become: true
  loop:
    - ranch-mosquitto
    - ranch-wyze-bridge

- name: Install daemon plists
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../launchd/{{ item }}.plist.j2"
    dest: /Library/LaunchDaemons/{{ item }}.plist
    owner: root
    group: wheel
    mode: "0644"
  become: true
  loop: "{{ ranch_daemons }}"
  notify: reload launchd daemons

- name: Daemons loaded?
  ansible.builtin.command: launchctl print system/{{ item }}
  become: true
  register: ld
  changed_when: false
  check_mode: false
  failed_when: false
  loop: "{{ ranch_daemons }}"

- name: Bootstrap missing daemons
  ansible.builtin.command: launchctl bootstrap system /Library/LaunchDaemons/{{ item.item }}.plist
  become: true
  loop: "{{ ld.results }}"
  loop_control: { label: "{{ item.item }}" }
  when: item.rc != 0
