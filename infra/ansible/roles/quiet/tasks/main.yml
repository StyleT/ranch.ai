---
- name: Read disabled launch agents for uid {{ ranch_uid }}
  ansible.builtin.command: launchctl print-disabled gui/{{ ranch_uid }}
  register: disabled_out
  changed_when: false
  check_mode: false

- name: Parse disabled labels
  ansible.builtin.set_fact:
    disabled_labels: "{{ (disabled_out.stdout ~ '\n' ~ disabled_out.stderr) | regex_findall('\"([^\"]+)\" => disabled') }}"

- name: Disabled labels found
  ansible.builtin.debug:
    msg: "{{ disabled_labels | length }} labels disabled in gui/{{ ranch_uid }}"

- name: Disable noisy per-user agents (effective at next login/reboot)
  ansible.builtin.command: launchctl disable gui/{{ ranch_uid }}/{{ item }}
  loop: "{{ disabled_agents }}"
  when: item not in disabled_labels

- name: Siri off
  community.general.osx_defaults:
    domain: com.apple.assistant.support
    key: Assistant Enabled
    type: bool
    value: false

- name: Which disabled agents are still running
  ansible.builtin.command: pgrep -u {{ ranch_user }} -x {{ item }}
  register: pg
  changed_when: false
  check_mode: false
  failed_when: false
  loop: "{{ quiet_process_names }}"

- name: Still-running list
  ansible.builtin.set_fact:
    quiet_still_running: "{{ pg.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"

- name: Report (reboot pending)
  ansible.builtin.debug:
    msg: "Still running until next reboot: {{ quiet_still_running }}"
  when: quiet_still_running | length > 0 and not (strict_quiet | bool)

- name: Console session?
  ansible.builtin.shell: who | awk '$2=="console"{print $1}'
  register: console_user
  changed_when: false
  check_mode: false

- name: Assert quiet (strict mode, after reboot)
  ansible.builtin.assert:
    that:
      - console_user.stdout | trim == ''
      - quiet_still_running | length == 0
    fail_msg: "console user: '{{ console_user.stdout | trim }}'; disabled agents still running: {{ quiet_still_running }}"
    success_msg: "No console session; all {{ quiet_process_names | length }} agents absent."
  when: strict_quiet | bool
