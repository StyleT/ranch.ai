---
- name: reload tailscaled
  ansible.builtin.shell: |
    if launchctl print system/com.ranch.tailscaled >/dev/null 2>&1; then
      launchctl kickstart -k system/com.ranch.tailscaled
    else
      launchctl bootstrap system /Library/LaunchDaemons/com.ranch.tailscaled.plist
    fi
  become: true
