[project]
name = "ranch-prelabel"
version = "0.0.1"
description = "Local pre-labeling of the clip frames (Florence-2 through transformers, Qwen3-VL through mlx_vlm.server; Moondream 3.1 kept as the record of its triage) and its bench on the acceptance set. Tooling only, runs on the laptop; the mini never needs it."
requires-python = ">=3.11,<3.14"
dependencies = [
  "moondream>=1.3",
  "transformers>=4.57",
  "torch>=2.6,<2.15",  # kestrel-mps-torch-ext ships native libraries for torch 2.9 to 2.14 only
  "torchvision",  # the Qwen2.5-VL processor (Rex-Omni) imports it
  "pillow",
  "numpy",
  "openai>=1.50",  # Qwen3-VL through mlx_vlm.server (evals/vlm), OpenAI-compatible
]
